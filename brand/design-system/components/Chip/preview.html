<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<style>
body{margin:0;padding:24px;background:var(--bg);color:var(--text)}
.g{display:grid;gap:16px}
.t{border-radius:var(--radius-md);padding:24px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;box-shadow:inset 0 0 0 1px var(--surface)}
.c{font:600 13px/18px var(--font-sans);letter-spacing:.02em;margin-top:var(--space-2);color:var(--text)}
</style>
<div class="g">
<div><div class="t" data-theme="app" style="background:var(--bg)"><span class="pb-chip pb-chip--on">Visits</span><span class="pb-chip">Walks</span><span class="pb-chip">Boarding</span></div><div class="c">Dark (app)</div></div>
<div><div class="t" data-theme="light" style="background:var(--bg)"><span class="pb-chip pb-chip--on">Visits</span><span class="pb-chip">Walks</span><span class="pb-chip">Boarding</span></div><div class="c">Light</div></div>
</div>
